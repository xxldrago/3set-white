name: mobile
description: "3set VPN Mobile Client"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  app_links: ^7.2.2
  connectivity_plus: ^7.3.2
  cupertino_icons: ^2.0.0
  dio: ^5.9.2
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_inappwebview: 6.1.5
  flutter_local_notifications: 23.0.4
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  json_annotation: ^4.12.0
  jwt_decoder: ^2.0.1
  local_auth: ^3.0.2
  logger: ^2.7.0
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.8
  sqlite3: ^3.9.2
  sqlite3_flutter_libs: ^0.6.0+eol
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  ffigen: ^23.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.4
  riverpod_generator: ^4.0.10

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-Variable.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf