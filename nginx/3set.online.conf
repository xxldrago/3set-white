# LEGACY / NOT IN USE — the live 3set.online vhost is `nginx/3set-landing.conf`
# (host: /etc/nginx/sites-enabled/3set-landing.conf). This file is not mounted by
# docker-compose and is kept only as a historical redirect variant. Do not deploy it.
# --- 3set.online redirect to dash ---
server {
    listen 80;
    listen [::]:80;
    server_name 3set.online;
    return 301 https://dash.3set.online$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 3set.online;
    ssl_certificate /etc/letsencrypt/live/dash.3set.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dash.3set.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        return 301 https://dash.3set.online$request_uri;
    }
}
