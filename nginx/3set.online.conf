server {
    server_name 3set.online www.3set.online;
    root /var/www/3set.online;
    index index.html;

    # Static assets are content-stable: long-lived browser cache.
    location ~* \.(woff2|webp|png|jpe?g|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location / {
        expires 5m;
        try_files $uri $uri/ =404;
    }

    # Support intake (landing form -> Next.js app). Same-origin on purpose: the
    # app exposes NO CORS headers for this path, so a third-party page cannot
    # reach it cross-origin (a JSON preflight is refused), while the landing's own
    # JS posts to it without any CORS round-trip. Fixed upstream only.
    location /api/support/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32k;
        proxy_read_timeout 30s;
    }

    # HTTP/2 must be enabled on every 443 listener on the same address, or nginx
    # logs "protocol options redefined" and may serve HTTP/1.1 for all vhosts.
    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/my.3set.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my.3set.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = 3set.online) {
        return 301 https://$host$request_uri;
    }

    if ($host = www.3set.online) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name 3set.online www.3set.online;
    return 404;
}
