# nginx configuration for 3set-white (OPS-01)
# dash.3set.online -> Next.js cabinet; 3set.online -> static landing;
# limove.3set.online -> limove-app; kino.3set.online -> web; seif.3set.online -> kryptoseif

# --- 3set.online (static landing page) -----------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 3set.online;

    ssl_certificate     /etc/letsencrypt/live/dash.3set.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dash.3set.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16M;

    root /var/www/landing;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Blog, guides, setup pages
    location ~* ^/(blog|setup|router|shadowsocks|wireguard|vless-reality|windows|android|mac|ios|smart-tv|terms|privacy)/ {
        try_files $uri $uri/index.html =404;
    }
}

# --- HTTP for ACME challenge & redirect (3set.online) --------------------------
server {
    listen 80;
    listen [::]:80;
    server_name 3set.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- dash.3set.online (dashboard / cabinet) ----------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dash.3set.online;

    ssl_certificate     /etc/letsencrypt/live/dash.3set.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dash.3set.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16M;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

