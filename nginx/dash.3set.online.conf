# nginx/dash.3set.online.conf — production edge for dash.3set.online (OPS-01).
#
# The cabinet renamed panel.3set.online -> dash.3set.online. Fixed upstream only
# — proxy_pass targets the local Next standalone web (127.0.0.1:3001, published by
# docker-compose.ports.yml) and is never derived from user input (T-05-26, no
# SSRF/open-proxy). TLS is terminated here with Let's Encrypt certs
# (live/dash.3set.online). The upload cap (16m) sits above the 5 MiB
# ticket-attachment limit (MAX_ATTACHMENT_BYTES); proxy_read_timeout 90s exceeds
# the Platega 60s callback contract (T-05-29).
#
# panel.3set.online is KEPT as a live alias on its own still-valid certificate,
# NOT a redirect. Two reasons:
#   * the Platega callback URL (https://panel.3set.online/api/platega/callback) is
#     configured in the merchant dashboard, not in this repo, and redirecting a
#     POST can break payment confirmation;
#   * session cookie `3set_session` is host-only (no Domain attribute), so
#     redirecting would additionally force every user to re-authenticate twice.
# Session cookies are host-scoped, so this alias shares no session with dash —
# that is expected and acceptable for a transitional alias.
#
# Drop the panel.3set.online blocks once the Platega dashboard points at
# dash.3set.online and the old links have aged out.
#
# my.3set.online keeps redirecting to the cabinet — registration and reset mails
# already in users' inboxes point there.

# --- HTTPS: the cabinet ----------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dash.3set.online;

    ssl_certificate     /etc/letsencrypt/live/dash.3set.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dash.3set.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Platega callback contract: handler acks fast, but keep the read
        # timeout >= 75s so a slow upstream never trips a 60s redelivery.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

# --- HTTP: ACME challenge (certbot renew) + redirect to HTTPS ---------------
server {
    listen 80;
    listen [::]:80;
    server_name dash.3set.online;

    # Let's Encrypt HTTP-01 (webroot) challenge — certbot renews via this path.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Legacy host: panel.3set.online, still served -------------------------
# Transitional alias on the existing certificate. Serves the cabinet rather than
# redirecting so the Platega POST callback and existing bookmarks keep working.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name panel.3set.online;

    ssl_certificate     /etc/letsencrypt/live/panel.3set.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.3set.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name panel.3set.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Legacy host: my.3set.online -> 301 to the cabinet ----------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name my.3set.online;

    ssl_certificate     /etc/letsencrypt/live/my.3set.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my.3set.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://dash.3set.online$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name my.3set.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://dash.3set.online$request_uri;
    }
}