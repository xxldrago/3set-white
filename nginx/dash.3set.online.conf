# nginx configuration for 3set-white (OPS-01)
# Both dashboard and landing served from same Next.js instance

# --- 3set.online (landing page) -----------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 3set.online;

    ssl_certificate     /etc/letsencrypt/live/dash.3set.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dash.3set.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16M;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

# --- HTTP for ACME challenge (3set.online) ------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name 3set.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- dash.3set.online (dashboard) ---------------------------------------------
