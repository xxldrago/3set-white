# nginx/my.3set.online.conf — production edge for my.3set.online (OPS-01).
#
# Fixed upstream only — the proxy_pass target is hardcoded to web:3000, never
# derived from user input (T-05-26, no SSRF/open-proxy). TLS is terminated here
# with Let's Encrypt certs (live/my.3set.online). The upload cap (8m) sits above
# the 5 MiB ticket-attachment limit (MAX_ATTACHMENT_BYTES); proxy_read_timeout
# 75s exceeds the Platega 60s callback contract (T-05-29).

# --- HTTP: ACME challenge + redirect everything else to HTTPS ---------------
server {
    listen 80;
    listen [::]:80;
    server_name my.3set.online;

    # Let's Encrypt HTTP-01 (webroot) challenge — certbot renews via this path.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: TLS termination + reverse proxy to the Next standalone web ------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name my.3set.online;

    ssl_certificate     /etc/letsencrypt/live/my.3set.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my.3set.online/privkey.pem;

    client_max_body_size 8m;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # CR-02: overwrite XFF with the edge-set single hop. Using
        # $proxy_add_x_forwarded_for would prepend the client-supplied header,
        # making the first entry attacker-controlled and defeating rate limits.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Platega callback contract: handler acks fast, but keep the read
        # timeout ≥ 75s so a slow upstream never trips a 60s redelivery.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
