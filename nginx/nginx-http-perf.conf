# Drop-in for the `http { }` block of /etc/nginx/nginx.conf.
# Ubuntu's default only compresses text/html because gzip_types is commented
# out; CSS/JS/JSON/SVG then travel uncompressed. Keep these directives inside
# the http block (not inside a server block).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_min_length 256;
gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;

# Brotli (Ubuntu 24.04 packages: libnginx-mod-http-brotli-filter and
# libnginx-mod-http-brotli-static). Modern browsers prefer br over gzip.
brotli on;
brotli_comp_level 6;
brotli_min_length 256;
brotli_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;

# HTTP/2: add `http2` to EVERY `listen ... 443 ssl` directive. Mixing HTTP/2 and
# non-HTTP/2 listeners on the same address:port makes nginx log
# "protocol options redefined" and can downgrade the shared listener to HTTP/1.1.
